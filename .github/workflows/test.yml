name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Node ${{ matrix.node-version }}, NestJS ${{ matrix.nest }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]
        nest: [11, 10]
        include:
          - nest: 10
            peers: >-
              @nestjs/common@10.3.0
              @nestjs/core@10.3.0
              @nestjs/testing@10.3.0
              @nestjs/platform-express@10.3.0
              @google-cloud/secret-manager@5.6.0

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install NestJS ${{ matrix.nest }} peers
        if: matrix.peers
        run: pnpm add -D ${{ matrix.peers }}

      - name: Check formatting
        run: pnpm check-format

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test
